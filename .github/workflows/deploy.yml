name: Deploy Docusaurus to GitHub Pages
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Install dependencies
        working-directory: company-docsclassic
        run: npm ci
 
      - name: Build website
        working-directory: company-docsclassic
        run: npm run build
 
      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: company-docsclassic/build
 
  deploy:
    name: Deploy to GitHub Pages
    needs: build
 
    runs-on: ubuntu-latest
 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4